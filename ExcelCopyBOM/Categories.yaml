categories:
  # Layout tegninger
  layout_drawings:
    identifiers:
      identifier1: Project Number
      identifier2: Area Number
      identifier3: [100, 110, 120, 130, 140, 150, 160, 400]
    types:
      "100": General Layout (Situationsplan)
      "110": Foundation Layout
      "120": Pavement Plan (Belægningsplan)
      "130": Contingency layout/Emergency Plan (Beredskabsplan)
      "140": Construction Site (Byggepladstegning)
      "150": ATEX Layout
      "160": Setting-Out Plan (Afsætningsplan)
      "400": Piping Layout (Ledningsplan)
    category: Layout Drawings

  # Area tegninger
  area_drawings:
    identifiers:
      identifier1: Project Number
      identifier2: Area Number
      identifier3: [A, B, E, F, P, S, BF, PS]
    types:
      A: Area Arrangement Drawing
      B: Area Building Drawing
      E: Area Equipment Drawing
      F: Area Foundation Drawing
      P: Area Sub Terrain Piping Layout
      S: Area Sub Terrain Piping Layout
      BF: Area Building Drawing
      PS: Project Specific Parts
    category: Area Drawings

